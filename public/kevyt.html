<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STT Uutiskatsaus (kevyt)</title>
<!-- V19 kevyt testiversio: pelkkä HTML + ES5-JavaScript, ei Reactia, ei moduuleja.
     Data haetaan 5 min välein, kellot päivittyvät minuutin vaihtuessa,
     koko sivu ladataan uudelleen tunnin välein (vain jos palvelin vastaa). -->
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body { background: #0a0e17; color: #e8eaed; font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; overflow: hidden; }
#root { height: 100%; padding: 12px 20px; display: -webkit-box; display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; }
.row { display: -webkit-flex; display: flex; }
.header { -webkit-justify-content: space-between; justify-content: space-between; -webkit-align-items: center; align-items: center; padding-bottom: 6px; border-bottom: 2px solid #1e90ff; margin-bottom: 4px; -webkit-flex-shrink: 0; flex-shrink: 0; }
.live-dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: #34d399; margin-right: 10px; vertical-align: middle; }
.header-title { font-size: 28px; font-weight: 700; color: #1e90ff; letter-spacing: 2px; vertical-align: middle; }
.header-clock { font-size: 36px; font-weight: 700; color: #fff; }
.world-clocks { -webkit-justify-content: space-around; justify-content: space-around; -webkit-align-items: center; align-items: center; padding: 28px 0 18px; border-bottom: 1px solid #1a2540; -webkit-flex-shrink: 0; flex-shrink: 0; }
.world-clock { text-align: center; white-space: nowrap; }
.world-clock svg { width: 172px; height: 172px; display: block; margin: 0 auto; }
.wc-city { display: block; font-size: 30px; font-weight: 700; color: #fff; letter-spacing: 1px; margin-top: 8px; }
.wc-digital { display: block; font-size: 29px; font-weight: 500; color: #667788; }
.date-bar { -webkit-justify-content: space-between; justify-content: space-between; font-size: 18px; color: #5f6368; padding: 4px 0; -webkit-flex-shrink: 0; flex-shrink: 0; }
.section-label { font-size: 36px; font-weight: 700; color: #1e90ff; letter-spacing: 3px; padding: 10px 0 4px; border-bottom: 1px solid #1a2744; margin-bottom: 4px; }
.top-stories { -webkit-flex: 2 1 0px; flex: 2 1 0px; min-height: 0; overflow: hidden; display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; -webkit-justify-content: space-around; justify-content: space-around; }
.latest-news { -webkit-flex: 3 1 0px; flex: 3 1 0px; min-height: 0; overflow: hidden; display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; -webkit-justify-content: space-around; justify-content: space-around; }
.hl { display: -webkit-flex; display: flex; -webkit-align-items: baseline; align-items: baseline; padding: 5px 0; border-bottom: 1px solid #12161f; }
.hl-src { width: 160px; -webkit-flex-shrink: 0; flex-shrink: 0; font-weight: 700; white-space: nowrap; overflow: hidden; margin-right: 12px; }
.hl-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
.hl-title { -webkit-flex: 1 1 0px; flex: 1 1 0px; min-width: 0; font-weight: 600; color: #e8eaed; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hl-time { width: 150px; -webkit-flex-shrink: 0; flex-shrink: 0; text-align: right; white-space: nowrap; margin-left: 12px; }
.top .hl-src { font-size: 30px; } .top .hl-title { font-size: 50px; } .top .hl-time { font-size: 28px; }
.lat .hl-src { font-size: 24px; } .lat .hl-title { font-size: 34px; } .lat .hl-time { font-size: 22px; width: 140px; }
.lat .hl-dot { width: 8px; height: 8px; }
.time-fresh { color: #34d399; font-weight: 700; } .time-recent { color: #fbbf24; } .time-old { color: #6b7280; }
.new-badge { display: inline-block; background: #34d399; color: #0a0e17; font-size: 16px; font-weight: 800; padding: 1px 6px; border-radius: 3px; margin-left: 6px; vertical-align: middle; letter-spacing: 1px; }
.trend-bar { white-space: nowrap; overflow: hidden; padding: 4px 0; -webkit-flex-shrink: 0; flex-shrink: 0; }
.trend-pill { display: inline-block; background: #1a2744; color: #8ab4f8; font-size: 18px; padding: 2px 10px; border-radius: 12px; margin-right: 8px; }
.trend-count { color: #5f6368; font-size: 15px; margin-left: 4px; }
.msg { font-size: 36px; color: #8899aa; padding: 40px 0; }
</style>
</head>
<body>
<div id="root">
  <div class="row header">
    <div><span class="live-dot"></span><span class="header-title">STT — UUTISKATSAUS</span></div>
    <div class="header-clock" id="clock">--:--</div>
  </div>
  <div class="row world-clocks" id="wclocks"></div>
  <div class="row date-bar"><span id="date"></span><span id="updated">Päivitetty —</span></div>
  <div class="section-label">PÄÄUUTISET</div>
  <div class="top-stories top" id="top"><div class="msg">Haetaan uutisia...</div></div>
  <div class="section-label">TUOREIMMAT</div>
  <div class="latest-news lat" id="latest"></div>
  <div class="trend-bar" id="trends"></div>
</div>
<script>
(function () {
  'use strict';
  var DATA_URL = 'data/news.json';
  var DATA_INTERVAL = 5 * 60 * 1000;   // data 5 min välein (GitHub päivittää tunnin välein)
  var RELOAD_AFTER = 60 * 60 * 1000;   // koko sivu uudelleen tunnin välein
  var startedAt = new Date().getTime();
  var lastGenerated = '';
  var data = null;

  var SRC_COLORS = {
    'STT': '#3b82f6', 'Yle Uutiset': '#22c55e', 'Yle Ulkomaat': '#22c55e',
    'HS Tuoreimmat': '#f59e0b', 'HS Ulkomaat': '#f59e0b', 'Kauppalehti': '#06b6d4',
    'BBC World': '#ef4444', 'BBC Top': '#ef4444', 'Politico EU': '#a855f7',
    'Al Jazeera': '#f97316', 'Guardian World': '#22d3ee', 'NY Times World': '#9ca3af',
    'France24': '#facc15', 'DW': '#60a5fa', 'IS Tuoreimmat': '#fb923c', 'IS Ulkomaat': '#fb923c',
    'IL Uutiset': '#f472b6', 'SVT': '#ec4899'
  };
  var SHORT = {
    'Yle Uutiset': 'YLE', 'Yle Ulkomaat': 'YLE', 'Yle Suosituimmat': 'YLE',
    'HS Tuoreimmat': 'HS', 'HS Ulkomaat': 'HS', 'BBC World': 'BBC', 'BBC Top': 'BBC',
    'Guardian World': 'GUARDIAN', 'NY Times World': 'NYTIMES', 'IS Tuoreimmat': 'IS',
    'IS Ulkomaat': 'IS', 'IL Uutiset': 'IL', 'Al Jazeera': 'ALJAZ', 'Politico EU': 'POLIT.',
    'France24': 'FRANCE24', 'DW': 'DW', 'Kauppalehti': 'KL', 'SVT': 'SVT', 'STT': 'STT'
  };
  var FI_HARD = ['Yle', 'HS', 'STT', 'Kauppalehti'];
  var INTL_HARD = ['BBC', 'Al Jazeera', 'Guardian', 'NY Times', 'DW', 'Politico'];
  var ALL_FI = ['Yle', 'HS', 'IS', 'IL', 'STT', 'Kauppalehti'];
  var ALL_INTL = ['BBC', 'Al Jazeera', 'Guardian', 'NY Times', 'Politico', 'France24', 'DW', 'SVT'];
  var ALL = ALL_FI.concat(ALL_INTL);
  var CLOCKS = [
    { city: 'NEW YORK', tz: 'America/New_York', std: -5, dst: 'us' },
    { city: 'LONTOO', tz: 'Europe/London', std: 0, dst: 'eu' },
    { city: 'MOSKOVA', tz: 'Europe/Moscow', std: 3, dst: '' },
    { city: 'TOKIO', tz: 'Asia/Tokyo', std: 9, dst: '' },
    { city: 'SYDNEY', tz: 'Australia/Sydney', std: 10, dst: 'au' }
  ];
  var WEEKDAYS = ['sunnuntai', 'maanantai', 'tiistai', 'keskiviikko', 'torstai', 'perjantai', 'lauantai'];
  var MONTHS = ['tammikuuta', 'helmikuuta', 'maaliskuuta', 'huhtikuuta', 'toukokuuta', 'kesäkuuta',
    'heinäkuuta', 'elokuuta', 'syyskuuta', 'lokakuuta', 'marraskuuta', 'joulukuuta'];

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function startsAny(s, list) {
    for (var i = 0; i < list.length; i++) if (s.indexOf(list[i]) === 0) return list[i];
    return null;
  }
  function ts(a) { var t = new Date(a.published).getTime(); return isNaN(t) ? 0 : t; }
  function byTime(a, b) { return ts(b) - ts(a); }
  function color(src) { return SRC_COLORS[src] || '#06b6d4'; }
  function shortName(src) { return SHORT[src] || String(src).toUpperCase(); }
  function ageMin(a) { var t = ts(a); return t ? Math.max(0, Math.floor((new Date().getTime() - t) / 60000)) : 9999; }
  function timeClass(a) { var m = ageMin(a); return m <= 15 ? 'time-fresh' : (m <= 60 ? 'time-recent' : 'time-old'); }
  function hm(d) { return pad(d.getHours()) + ':' + pad(d.getMinutes()); }

  // ── Aikavyöhykkeet: Intl jos tuettu, muuten kiinteät siirtymät + kesäaikasäännöt ──
  var intlOk = (function () {
    try { new Date().toLocaleString('en-US', { timeZone: 'Asia/Tokyo' }); return true; } catch (e) { return false; }
  })();
  function nthSunday(y, m, n) { // n>0: n:s sunnuntai, n<0: viimeinen; palauttaa päivän numeron
    if (n > 0) { var f = new Date(Date.UTC(y, m, 1)).getUTCDay(); return 1 + ((7 - f) % 7) + (n - 1) * 7; }
    var last = new Date(Date.UTC(y, m + 1, 0)); return last.getUTCDate() - last.getUTCDay();
  }
  function fallbackParts(now, c) {
    var y = now.getUTCFullYear(), off = c.std, t = now.getTime();
    if (c.dst === 'eu') {
      var s = Date.UTC(y, 2, nthSunday(y, 2, -1), 1), e = Date.UTC(y, 9, nthSunday(y, 9, -1), 1);
      if (t >= s && t < e) off += 1;
    } else if (c.dst === 'us') {
      var s2 = Date.UTC(y, 2, nthSunday(y, 2, 2), 7), e2 = Date.UTC(y, 10, nthSunday(y, 10, 1), 6);
      if (t >= s2 && t < e2) off += 1;
    } else if (c.dst === 'au') {
      var e3 = Date.UTC(y, 3, nthSunday(y, 3, 1), 16), s3 = Date.UTC(y, 9, nthSunday(y, 9, 1), 16);
      if (t < e3 || t >= s3) off += 1;
    }
    var d = new Date(t + off * 3600000);
    return { h: d.getUTCHours(), m: d.getUTCMinutes() };
  }
  function tzParts(now, c) {
    if (intlOk) {
      try {
        var s = now.toLocaleTimeString('en-GB', { timeZone: c.tz, hour: '2-digit', minute: '2-digit', hour12: false });
        var mm = s.match(/(\d+)\D+(\d+)/);
        if (mm) return { h: parseInt(mm[1], 10) % 24, m: parseInt(mm[2], 10) };
      } catch (e) {}
    }
    return fallbackParts(now, c);
  }

  function clockSvg(h, m) {
    var CX = 50, CY = 50, R = 44, out = '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="none" stroke="#334466" stroke-width="2"/>';
    for (var i = 0; i < 12; i++) {
      var a = (i * 30 - 90) * Math.PI / 180, r1 = R - (i % 3 === 0 ? 8 : 4);
      out += '<line x1="' + (CX + r1 * Math.cos(a)).toFixed(2) + '" y1="' + (CY + r1 * Math.sin(a)).toFixed(2) +
        '" x2="' + (CX + R * Math.cos(a)).toFixed(2) + '" y2="' + (CY + R * Math.sin(a)).toFixed(2) +
        '" stroke="#8899aa" stroke-width="' + (i % 3 === 0 ? 2.5 : 1.2) + '"/>';
    }
    function hand(angle, len, w) {
      var r = (angle - 90) * Math.PI / 180;
      return '<line x1="50" y1="50" x2="' + (CX + len * Math.cos(r)).toFixed(2) + '" y2="' + (CY + len * Math.sin(r)).toFixed(2) +
        '" stroke="#ffffff" stroke-width="' + w + '" stroke-linecap="round"/>';
    }
    out += hand(((h % 12) + m / 60) * 30, 24, 3.5) + hand(m * 6, 34, 2.5) + '<circle cx="50" cy="50" r="2.5" fill="#ef4444"/></svg>';
    return out;
  }

  function renderClocks() {
    var now = new Date(), html = '';
    document.getElementById('clock').textContent = hm(now);
    document.getElementById('date').textContent = WEEKDAYS[now.getDay()] + ' ' + now.getDate() + '. ' + MONTHS[now.getMonth()] + ' ' + now.getFullYear();
    for (var i = 0; i < CLOCKS.length; i++) {
      var p = tzParts(now, CLOCKS[i]);
      html += '<div class="world-clock">' + clockSvg(p.h, p.m) + '<span class="wc-city">' + CLOCKS[i].city +
        '</span><span class="wc-digital">' + pad(p.h) + ':' + pad(p.m) + '</span></div>';
    }
    document.getElementById('wclocks').innerHTML = html;
  }

  // ── Uutisvalinnat (sama logiikka kuin pääsovelluksessa) ──
  function pickTop(articles) {
    var fi = [], intl = [], seen = {}, i, a, fam;
    for (i = 0; i < articles.length; i++) {
      a = articles[i];
      if (a.source === 'Yle Suosituimmat' && a.feed_position === 0) { fi.push(a); seen.Yle = true; break; }
    }
    var leads = [];
    for (i = 0; i < articles.length; i++) if (articles[i].feed_position === 0) leads.push(articles[i]);
    leads.sort(byTime);
    for (i = 0; i < leads.length; i++) {
      a = leads[i];
      if (fi.length < 3) { fam = startsAny(a.source, FI_HARD); if (fam && !seen[fam]) { seen[fam] = true; fi.push(a); } }
      if (intl.length < 3) { fam = startsAny(a.source, INTL_HARD); if (fam && !seen[fam]) { seen[fam] = true; intl.push(a); } }
      if (fi.length >= 3 && intl.length >= 3) break;
    }
    return fi.concat(intl);
  }
  function pickLatest(articles, top) {
    var topTitles = {}, fi = [], intl = [], cnt = {}, i, a, prefix, c;
    for (i = 0; i < top.length; i++) topTitles[top[i].title] = true;
    for (i = 0; i < articles.length; i++) {
      a = articles[i];
      if (topTitles[a.title]) continue;
      prefix = startsAny(a.source, ALL) || a.source;
      c = cnt[prefix] || 0;
      if (c >= 2) continue;
      if (startsAny(a.source, ALL_FI) && fi.length < 8) { fi.push(a); cnt[prefix] = c + 1; }
      else if (startsAny(a.source, ALL_INTL) && intl.length < 7) { intl.push(a); cnt[prefix] = c + 1; }
      if (fi.length >= 8 && intl.length >= 7) break;
    }
    fi.sort(byTime); intl.sort(byTime);
    return fi.concat(intl);
  }
  function rowsHtml(list) {
    var html = '';
    for (var i = 0; i < list.length; i++) {
      var a = list[i], col = color(a.source), d = new Date(a.published);
      html += '<div class="hl"><div class="hl-src" style="color:' + col + '"><span class="hl-dot" style="background:' + col + '"></span>' +
        esc(shortName(a.source)) + '</div><div class="hl-title">' + esc(a.title) + '</div><div class="hl-time ' + timeClass(a) + '">' +
        (isNaN(d.getTime()) ? '' : hm(d)) + (ageMin(a) <= 15 ? '<span class="new-badge">UUSI</span>' : '') + '</div></div>';
    }
    return html;
  }
  function renderNews() {
    if (!data) return;
    var articles = (data.articles || []).slice().sort(byTime);
    var top = pickTop(articles);
    document.getElementById('top').innerHTML = rowsHtml(top);
    document.getElementById('latest').innerHTML = rowsHtml(pickLatest(articles, top));
    var t = data.trending_topics || [], th = '';
    for (var i = 0; i < t.length && i < 6; i++) th += '<span class="trend-pill">' + esc(t[i].topic) + '<span class="trend-count">' + esc(t[i].count) + '</span></span>';
    document.getElementById('trends').innerHTML = th;
  }

  function fetchNews() {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', DATA_URL + '?t=' + new Date().getTime(), true);
    xhr.timeout = 20000;
    xhr.onreadystatechange = function () {
      if (xhr.readyState !== 4) return;
      if (xhr.status === 200) {
        try {
          var parsed = JSON.parse(xhr.responseText);
          document.getElementById('updated').textContent = 'Päivitetty ' + hm(new Date());
          if (parsed.generated_at !== lastGenerated) { lastGenerated = parsed.generated_at; data = parsed; renderNews(); }
        } catch (e) {}
      } else if (!data) {
        document.getElementById('top').innerHTML = '<div class="msg">Uutisten haku epäonnistui – yritetään uudelleen</div>';
      }
      xhr = null;
    };
    xhr.send();
  }

  // Koko sivun uudelleenlataus tunnin välein, vain jos palvelin vastaa (ettei näyttö jää virhesivulle)
  function maybeReload() {
    if (new Date().getTime() - startedAt < RELOAD_AFTER) return;
    var x = new XMLHttpRequest();
    x.open('GET', 'kevyt.html?t=' + new Date().getTime(), true);
    x.timeout = 20000;
    x.onreadystatechange = function () {
      if (x.readyState === 4 && x.status === 200) window.location.reload();
    };
    x.send();
  }

  function onMinute() {
    renderClocks();
    if (data) renderNews(); // UUSI-merkit ja aikavärit ajan tasalle
    maybeReload();
    var now = new Date();
    setTimeout(onMinute, 60000 - (now.getSeconds() * 1000 + now.getMilliseconds()) + 100);
  }

  renderClocks();
  fetchNews();
  setInterval(fetchNews, DATA_INTERVAL);
  var n0 = new Date();
  setTimeout(onMinute, 60000 - (n0.getSeconds() * 1000 + n0.getMilliseconds()) + 100);
})();
</script>
</body>
</html>
