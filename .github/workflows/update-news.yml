name: Päivitä ja julkaise

# V17: ajastus kerran tunnissa klo 6-24.
# V16: rakennus ja julkaisu erillisissä vaiheissa, julkaisulle varayritys,
# actions-vaiheet päivitetty Node 24 -versioihin.

on:
  schedule:
    # Kerran tunnissa 17 yli, klo 6-24 Suomen aikaa (UTC 3-21 kattaa kesä- ja talviajan)
    - cron: '17 3-21 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Vain yksi ajo kerrallaan; uusi ajo odottaa edellisen valmistumista.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Hae uutisdata
        run: python scripts/fetch_news.py

      - name: Commitoi päivitetty data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/news.json
          if git diff --cached --quiet; then
            echo "Ei muutoksia dataan."
            exit 0
          fi
          git commit -m "📰 Uutisdata päivitetty $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs && git push && exit 0
            echo "Tallennus ei onnistunut (yritys $i), yritetään uudelleen..."
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "Datan tallennus repoon epäonnistui, julkaistaan silti haettu data."

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy_retry.outputs.page_url || steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Odota ennen varayritystä
        if: steps.deploy.outcome == 'failure'
        run: sleep 30

      - id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5

